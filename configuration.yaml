homeassistant:
  packages: !include_dir_named packages

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Zentrales Dashboard (Backlog G1) als YAML aus dem Repo, erzeugt von
# g1-skizze/build.py; die übrigen Dashboards bleiben in der UI
lovelace:
  dashboards:
    dashboard-zentral:
      mode: yaml
      filename: dashboards/zentral.yaml
      title: Zentral
      icon: mdi:home-lightning-bolt
      show_in_sidebar: true
      require_admin: true

# Zustandsverlauf 30 Tage; Langzeitstatistik (Stundenwerte) behält HA unbegrenzt,
# die Abrechnungsdaten liegen in InfluxDB. Ausgeschlossen sind Werte, die sehr oft
# schreiben und deren Verlauf niemand braucht (Analyse der Recorder-DB, Oktober 2026).
recorder:
  purge_keep_days: 30
  exclude:
    entities:
      - sensor.server_leistung              # Shelly alle 3 s, Energie: sensor.server_energie
      - sensor.grid_percentage              # Dashboard zeigt nur den aktuellen Wert
      - sensor.full_production_power
      - sensor.ebusd_global_uptime
      - sensor.vaillant_api_request_count
    entity_globs:
      - sensor.*_spannung*                  # Netzspannungen (openWB, Shelly)
      - sensor.openwb_chargepoint_*_frequenz
      - sensor.openwb_vehicle_*_datenaktualisierung
      - sensor.internetgatewaydevice*_geschwindigkeit*   # FRITZ!Box-Durchsatz

influxdb:
  max_retries: 3
  default_measurement: state
  include:
    entities:
      # Ist-Erzeugung der Dach-PV (FEMS) für den Prognosevergleich (Backlog E8)
      - sensor.productionenergy
      - sensor.productionpower
      # Solcast-Prognose als Referenz (E8)
      - sensor.solcast_pv_forecast_prognose_heute
      - sensor.solcast_pv_forecast_prognose_morgen
      - sensor.solcast_pv_forecast_prognose_verbleibende_leistung_heute
      - sensor.solcast_pv_forecast_prognose_aktuelle_stunde
      - sensor.solcast_pv_forecast_prognose_nachste_stunde
      - sensor.solcast_pv_forecast_aktuelle_leistung
    entity_globs:
      - sensor.*_production
      - sensor.*_consumption
      - sensor.gridbuyenergy
      - sensor.gridsellenergy
      # Open-Meteo-Prognosen ICON-CH1/CH2/D2 im Test (E8)
      - sensor.pv_prognose_*_energy_production_today
      - sensor.pv_prognose_*_energy_production_today_remaining
      - sensor.pv_prognose_*_energy_production_tomorrow
      - sensor.pv_prognose_*_energy_current_hour
      - sensor.pv_prognose_*_energy_next_hour
      - sensor.pv_prognose_*_power_production_now

pyscript:
  allow_all_imports: true
  apps:
    # Zugangsdaten für pyscript/meters.py (InfluxDB-Datenbank "meter")
    meters_persist:
      - dbhost: !secret influx_host
        dbuser: !secret influx_user
        dbpassword: !secret influx_pwd

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
alert: !include alerts.yaml
