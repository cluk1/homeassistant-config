homeassistant:
  packages: !include_dir_named packages

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

recorder:
  purge_keep_days: 90
  exclude:
    entity_globs:
      - sensor.openwb_chargepoint_*_spannung_l*
      - sensor.openwb_chargepoint_*_frequenz
      - sensor.flat*_grid_percentage
      - sensor.heatpump_grid_percentage
      - sensor.full_production_power

influxdb:
  max_retries: 3
  default_measurement: state
  include:
    entity_globs:
      - sensor.*_production
      - sensor.*_consumption
      - sensor.gridbuyenergy
      - sensor.gridsellenergy

pyscript:
  allow_all_imports: true
  apps:
    # Zugangsdaten für pyscript/meters.py (InfluxDB-Datenbank "meter")
    meters_persist:
      - dbhost: !secret influx_host
        dbuser: !secret influx_user
        dbpassword: !secret influx_pwd

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
alert: !include alerts.yaml
