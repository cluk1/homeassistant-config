# Zentrales Dashboard (Backlog G1) – ERZEUGT von g1-skizze/build.py, nicht von Hand ändern.
# Querformat (PC) und Hochformat (Handy) als picture-elements über den Bildern in
# www/dashboard/; private Entity-IDs kommen aus secrets.yaml.
title: Zentral
views:
  - title: "Übersicht"
    path: uebersicht
    icon: mdi:home-lightning-bolt
    panel: true
    cards:
      - type: vertical-stack
        cards:
          - type: conditional
            conditions:
              - condition: screen
                media_query: "(orientation: landscape)"
            card:
              type: picture-elements
              image: "/local/dashboard/zentral-quer.svg?v=506d5571"
              elements:
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: sensor.productionpower
                      above: 0.05
                  elements:
                    - type: image
                      image: "/local/dashboard/zentral-quer-pv_battery.svg?v=506d5571"
                      tap_action:
                        action: "none"
                      hold_action:
                        action: "none"
                      style:
                        left: 0
                        top: 0
                        width: "100%"
                        transform: "none"
                        pointer-events: "none"
                - type: conditional
                  conditions:
                    - condition: numeric_state
                      entity: sensor.essdischargepower
                      above: 30
