# Netzanteil seit Mitternacht je Partei (Measurement "grid" aus pyscript/meters.py).
# Ein Zeitstempel markiert das Ende seines Intervalls, daher "time > Mitternacht":
# das Intervall 23:45–24:00 gehört zum Vortag (wie im Abrechnungsbericht).
# Gemeinsame Felder stehen einmal in der Vorlage &grid_day, jede Abfrage übernimmt
# sie mit <<: *grid_day und setzt nur Name, ID und Partei.
sensor:
  - platform: influxdb
    host: !secret influx_host
    username: !secret influx_user
    password: !secret influx_pwd
    queries:
      - &grid_day
        name: Wohnung 1 Netzbezug heute
        unique_id: flat1_grid_energy_day
        unit_of_measurement: kWh
        measurement: meter.autogen.grid
        field: value
        group_function: sum
        database: meter
        where: >
          {{ '"meter" = \'flat1\' and time > \'' ~ (as_timestamp(today_at()) | timestamp_utc) ~ '\'' }}
      - <<: *grid_day
        name: Wohnung 2 Netzbezug heute
        unique_id: flat2_grid_energy_day
        where: >
          {{ '"meter" = \'flat2\' and time > \'' ~ (as_timestamp(today_at()) | timestamp_utc) ~ '\'' }}
      - <<: *grid_day
        name: Wohnung 3 Netzbezug heute
        unique_id: flat3_grid_energy_day
        where: >
          {{ '"meter" = \'flat3\' and time > \'' ~ (as_timestamp(today_at()) | timestamp_utc) ~ '\'' }}
      - <<: *grid_day
        name: Wohnung 4 Netzbezug heute
        unique_id: flat4_grid_energy_day
        where: >
          {{ '"meter" = \'flat4\' and time > \'' ~ (as_timestamp(today_at()) | timestamp_utc) ~ '\'' }}
      - <<: *grid_day
        name: Allgemeinstrom Netzbezug heute
        unique_id: comm_grid_energy_day
        where: >
          {{ '"meter" = \'comm\' and time > \'' ~ (as_timestamp(today_at()) | timestamp_utc) ~ '\'' }}
      - <<: *grid_day
        name: Wärmepumpe Netzbezug heute
        unique_id: heatpump_grid_energy_day
        where: >
          {{ '"meter" = \'heatpump\' and time > \'' ~ (as_timestamp(today_at()) | timestamp_utc) ~ '\'' }}
      - <<: *grid_day
        name: Wallbox Ladepunkt 1 Netzbezug heute
        unique_id: wallbox_cp1_grid_energy_day
        where: >
          {{ '"meter" = \'wallbox_cp1\' and time > \'' ~ (as_timestamp(today_at()) | timestamp_utc) ~ '\'' }}
      - <<: *grid_day
        name: Wallbox Ladepunkt 2 Netzbezug heute
        unique_id: wallbox_cp2_grid_energy_day
        where: >
          {{ '"meter" = \'wallbox_cp2\' and time > \'' ~ (as_timestamp(today_at()) | timestamp_utc) ~ '\'' }}
