# Tageskosten je Partei: Netzanteil heute (energy_sensors_influxdb.yaml) × Strompreis.
# Wärmepumpe mit Wärmestrompreis. Ohne Netzanteil-Wert kein Kostenwert.
template:
  - sensor:
      - unique_id: flat1_energy_costs_day
        default_entity_id: sensor.flat1_energy_costs_day
        name: "Wohnung 1 Stromkosten heute"
        device_class: monetary
        unit_of_measurement: €
        availability: "{{ has_value('sensor.flat1_grid_energy_day') }}"
        state: >
          {{ (states('sensor.flat1_grid_energy_day') | float
              * states('input_number.energy_grid_price') | float / 100) | round(2) }}
