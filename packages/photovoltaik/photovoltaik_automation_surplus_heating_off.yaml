automation:
  - id: photovoltaik_surplus_heating_off
    alias: Photovoltaik Surplus Heating off
    description: ""
    triggers:
      - trigger: numeric_state
        entity_id:
          - sensor.esssoc
        below: 10
      - trigger: numeric_state
        entity_id:
          - sensor.solcast_pv_forecast_forecast_next_x_hours
        below: 3
      - trigger: sun
        event: sunset
        offset: "-1:00"
      - trigger: numeric_state
        entity_id:
          - sensor.ebusd_ctlv2_displayedoutsidetemp_value
        below: 2
    # Bewusst ohne Bedingung "Heizung global an": die Überheizung muss auch dann
    # sauber enden, wenn die Heizung zwischendurch global ausgeschaltet wurde.
    conditions:
      - condition: or
        conditions:
          - condition: state
            entity_id: input_boolean.heating_overheating_active
            state: "on"
          - condition: numeric_state
            entity_id: input_number.flat_temperature_setpoint
            above: 20
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.flat_temperature_setpoint
        data:
          value: 20
      # kurz warten, bis der Heizbedarf den neuen Sollwert übernommen hat
      - delay:
          seconds: 10
      # Merker aus: heating_power_auto läuft dadurch sofort wieder an
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heating_overheating_active
      - action: button.press
        metadata: {}
        target:
          entity_id: button.heizen_alltag
        data: {}
      - action: script.notify_info
        data:
          name: Photovoltaik Surplus Heating off
          message: Gebäude Überheizung aus
    mode: single
