automation:
  - id: photovoltaik_surplus_heating_on
    alias: Photovoltaik Surplus Heating On
    description: ""
    triggers:
      - trigger: state
        entity_id:
          - sensor.ebusd_hmu_status00_compressorstate
        to: "Hot_Water"
      - trigger: state
        entity_id:
          - sensor.ebusd_hmu_status00_compressorstate
        to: "Heating"
        for:
          hours: 0
          minutes: 0
          seconds: 0
      - trigger: sun
        event: sunset
        offset: "-5:00"
      - trigger: numeric_state
        entity_id:
          - sensor.esssoc
        above: 20
    conditions:
      - condition: state
        entity_id: input_boolean.heating_on_off
        state: "on"
      - condition: numeric_state
        entity_id: sensor.esssoc
        above: 20
      - condition: numeric_state
        entity_id: sensor.solcast_pv_forecast_forecast_next_x_hours
        above: 5.5
      - condition: sun
        before: sunset
        before_offset: "-3:00"
        after: sunrise
      - condition: numeric_state
        entity_id: sensor.ebusd_ctlv2_displayedoutsidetemp_value
        above: 0
      - condition: state
        entity_id: input_boolean.heating_overheating_active
        state: "off"
    actions:
      # heating_power_auto pausiert, solange der Merker gesetzt ist
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.heating_overheating_active
      - action: script.notify_info
        data:
          name: Photovoltaik Surplus Heating On
          message: Gebäude Überheizung ein
      - action: button.press
        metadata: {}
        target:
          entity_id: button.uberheizung
        data: {}
      - action: input_number.set_value
        target:
          entity_id: input_number.flat_temperature_setpoint
        data:
          value: 22
      - variables:
          setpoint: "{{ state_attr('climate.ctlv2_heating_vaillant', 'temperature') }}"
          neue_temp: "{{ min( [setpoint + 0.5, 22] ) }}"
      # Raumsollwert schrittweise anheben; Abbruch auch, wenn die Überheizung
      # inzwischen beendet wurde (Merker aus), sonst arbeitet die Rampe gegen die Regelung
      - repeat:
          until:
            - condition: or
              conditions:
                - condition: numeric_state
                  entity_id: sensor.esssoc
                  below: 18
                - condition: numeric_state
                  entity_id: climate.ctlv2_heating_vaillant
                  attribute: temperature
                  above: 21.8
                - condition: state
                  entity_id: input_boolean.heating_overheating_active
                  state: "off"
          sequence:
            - action: climate.set_temperature
              data:
                temperature: "{{ neue_temp }}"
              target:
                entity_id: climate.ctlv2_heating_vaillant
            - delay:
                hours: 0
                minutes: 7
                seconds: 0
                milliseconds: 0
            - variables:
                setpoint: "{{ state_attr('climate.ctlv2_heating_vaillant', 'temperature') }}"
                neue_temp: "{{ min( [setpoint + 0.5, 22] ) }}"
    mode: single
    max_exceeded: silent
