sensor:
  - platform: group
    name: "Wohnungen Temperatur Mittel"
    unique_id: flats_avg_temperature
    type: mean
    ignore_non_numeric: true
    entities:
      # vorübergehend ausgenommen (seit 2026-10-17)
      #- !secret flat1_temperature
      - !secret flat2_temperature
      - !secret flat3_temperature
  - platform: group
    name: "Wohnungen Temperatur Minimum"
    unique_id: flats_min_temperature
    type: min
    ignore_non_numeric: true
    entities:
      # vorübergehend ausgenommen (seit 2026-10-17)
      #- !secret flat1_temperature
      - !secret flat2_temperature
      - !secret flat3_temperature
  # Neutral benannte Stellvertreter für die Luftfeuchte-Sensoren der Wohnungen.
  # Die echten Entity-IDs enthalten Mieternamen und stehen nur in secrets.yaml.
  - platform: group
    name: "Wohnung 1 Luftfeuchte"
    unique_id: flat1_humidity
    type: max
    entities:
      - !secret flat1_humidity
  - platform: group
    name: "Wohnung 2 Luftfeuchte"
    unique_id: flat2_humidity
    type: max
    entities:
      - !secret flat2_humidity
  - platform: group
    name: "Wohnung 3 Luftfeuchte"
    unique_id: flat3_humidity
    type: max
    entities:
      - !secret flat3_humidity
