# Die passenden Warmwasser-Einstellungen setzt automation.hotwater_mode,
# die selbst auf input_boolean.heating_on_off reagiert.
automation:
  - id: heating_global_off
    alias: "Heating Global off"
    description: ""
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.heating_on_off
        from: "on"
        to: "off"
    conditions: []
    actions:
      - action: climate.set_hvac_mode
        data:
          hvac_mode: "off"
        target:
          entity_id: climate.ctlv2_heating_vaillant
      # Läuft noch eine PV-Überheizung, wird sie beendet (Sollwert zurück, Merker aus)
      - if:
          - condition: state
            entity_id: input_boolean.heating_overheating_active
            state: "on"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.flat_temperature_setpoint
            data:
              value: 20
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.heating_overheating_active
  - id: heating_global_on
    alias: "Heating Global on"
    description: ""
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - input_boolean.heating_on_off
        from: "off"
        to: "on"
    conditions: []
    actions:
      - action: climate.set_hvac_mode
        data:
          hvac_mode: "heat"
        target:
          entity_id: climate.ctlv2_heating_vaillant
      # Läuft noch eine PV-Überheizung, wird sie beendet (Sollwert zurück, Merker aus)
      - if:
          - condition: state
            entity_id: input_boolean.heating_overheating_active
            state: "on"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.flat_temperature_setpoint
            data:
              value: 20
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.heating_overheating_active
      # Sicherheitsnetz: die Regelung muss nach dem Einschalten aktiv sein
      - action: automation.turn_on
        target:
          entity_id: automation.heating_power_auto
