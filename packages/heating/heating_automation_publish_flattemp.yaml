automation:
  - id: heating_publish_flattemp
    alias: Heating Publish Flat Temperature
    description: ""
    triggers:
      - trigger: state
        entity_id:
          - sensor.flats_avg_temperature
      - trigger: homeassistant
        event: start
    conditions: []
    actions:
      - action: mqtt.publish
        data:
          qos: "0"
          retain: false
          topic: ha/flats/avgTemp
          payload: "{{ states('sensor.flats_avg_temperature') }}"
    mode: single
