template:
  - sensor:
      - unique_id: flats_heating_demand
        default_entity_id: sensor.flats_heating_demand
        name: Wohnungen Heizbedarf
        # ohne gültige Wohnungstemperatur kein Heizbedarf (sonst regeln die
        # Automationen auf einen Ersatzwert)
        availability: "{{ has_value('sensor.flats_avg_temperature') }}"
        state: >
          {% set temp_actual = states('sensor.flats_avg_temperature') | float %}
          {% set temp_wanted = ( states('input_number.flat_temperature_setpoint') | float - states('input_number.flat_temperature_tolerance') | float ) %}
          {{ (temp_wanted - temp_actual) | round(1, "half", default=0) }}
      - unique_id: heatpump_currentoutputpower
        default_entity_id: sensor.heatpump_currentoutputpower
        name: "Wärmepumpe Heizleistung"
        device_class: power
        unit_of_measurement: kW
        state: >
          {{ states('sensor.ebusd_hmu_currentconsumedpower_value')|float + states('sensor.ebusd_hmu_currentyieldpower_value')|float }}
      - unique_id: heatpump_cop
        default_entity_id: sensor.heatpump_cop
        name: "Wärmepumpe COP"
        device_class: power_factor
        # Momentan-COP nur bei stabilem Betrieb: ab 0,8 kW Leistungsaufnahme und
        # positiver Abgabe. Anlauf, Auslauf und Abtauen ergeben sonst Werte wie
        # 30 oder negative COPs; dann lieber kein Wert als ein falscher.
        # Im Kühlbetrieb sind COPs um 10 real, 15 ist nur eine Notbremse.
        availability: >
          {{ has_value('sensor.ebusd_hmu_currentconsumedpower_value')
             and has_value('sensor.heatpump_currentoutputpower')
             and states('sensor.ebusd_hmu_currentconsumedpower_value') | float(0) >= 0.8
             and states('sensor.heatpump_currentoutputpower') | float(0) > 0 }}
        state: >
          {% set cop = states('sensor.heatpump_currentoutputpower') | float
                       / states('sensor.ebusd_hmu_currentconsumedpower_value') | float %}
          {{ [cop, 15] | min | round(2) }}
  - binary_sensor:
      - unique_id: flat1_humidity_too_high
        default_entity_id: binary_sensor.flat1_humidity_too_high
        name: "Wohnung 1 Luftfeuchte zu hoch"
        state: >
          {{ states('sensor.flat1_humidity')|float >= states("input_number.flat_humidity_alert")|float }}
      - unique_id: flat2_humidity_too_high
        default_entity_id: binary_sensor.flat2_humidity_too_high
        name: "Wohnung 2 Luftfeuchte zu hoch"
        state: >
          {{ states('sensor.flat2_humidity')|float >= states("input_number.flat_humidity_alert")|float }}
      - unique_id: flat3_humidity_too_high
        default_entity_id: binary_sensor.flat3_humidity_too_high
        name: "Wohnung 3 Luftfeuchte zu hoch"
        state: >
          {{ states('sensor.flat3_humidity')|float >= states("input_number.flat_humidity_alert")|float }}
