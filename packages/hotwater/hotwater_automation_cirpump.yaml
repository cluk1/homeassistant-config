automation:
  - id: hotwater_cirpump
    alias: Hotwater Circulation Pump
    description: ""
    triggers: []
    conditions:
      - condition: or
        conditions:
          - condition: time
            after: "05:30:00"
            before: "21:00:00"
            weekday:
              - mon
              - tue
              - wed
              - thu
              - fri
          - condition: time
            after: "07:00:00"
            before: "21:00:00"
            weekday:
              - sat
              - sun
    actions:
      - action: water_heater.set_operation_mode
        metadata: {}
        target:
          device_id: 9153ed191d29d6e44fcbfe03eb667b93
        data:
          operation_mode: heat
      - action: input_boolean.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.circulation_pump
      - delay:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
      - action: water_heater.set_operation_mode
        metadata: {}
        target:
          device_id: 9153ed191d29d6e44fcbfe03eb667b93
        data:
          operation_mode: auto
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.circulation_pump
        data: {}
    mode: single
