automation:
  - id: hotwater_legio_lastrun
    alias: "Hotwater Legio Lastrun"
    description: ""
    triggers:
      - trigger: numeric_state
        entity_id:
          - sensor.ebusd_ctlv2_hwcstoragetemp_value
        for:
          hours: 0
          minutes: 1
          seconds: 0
        above: 59
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hotwater_legio_lastrun
        data:
          date: "{{ now().strftime('%Y-%m-%d') }}"
      - action: script.notify_info
        data:
          name: Hotwater Legio Lastrun
          message: Legionellen-Temperatur erreicht mit {{ states('sensor.ebusd_ctlv2_hwcstoragetemp_value')}}
    mode: single
