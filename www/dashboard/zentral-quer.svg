      <circle cx="36" cy="52" r="10" fill="#0f1318" stroke="#8b98a5" /><circle cx="106" cy="52" r="10" fill="#0f1318" stroke="#8b98a5" />
    </symbol>
    
    <symbol id="dormer" viewBox="0 0 60 80">
      <polygon points="0,30 30,0 60,30" fill="#2a2224" stroke="#4a3d40" stroke-width="2" />
      <rect x="6" y="30" width="48" height="50" fill="#232b33" stroke="#3a4652" stroke-width="2" />
      <rect x="18" y="40" width="24" height="30" fill="#141a21" stroke="#3a4652" />
    </symbol>
