    <rect x="144" width="138" height="30" rx="15" fill="#22303b" /><circle cx="160" cy="15" r="6" class="dot" /><text class="t" x="174" y="20">Überheizung</text>
    <rect x="294" width="136" height="30" rx="15" fill="#22303b" /><circle cx="310" cy="15" r="6" class="dot" /><text class="t" x="324" y="20">Heizregelung</text>
