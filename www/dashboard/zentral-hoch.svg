  <rect x="24" y="256" width="324" height="44" rx="22" fill="#22303b" /><circle cx="50" cy="278" r="8" class="dot" /><text class="t" x="70" y="287">Heizregelung</text>
  <rect x="372" y="256" width="324" height="44" rx="22" fill="#22303b" /><circle cx="398" cy="278" r="8" class="dot" /><text class="t" x="418" y="287">Kühlung</text>

  
  
