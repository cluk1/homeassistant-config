<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1820" font-family="Inter, Segoe UI, Roboto, sans-serif">
  
  <defs>
    <style>
      .bg { fill: #0f1318; }
      .wall { fill: #1d252e; stroke: #3a4652; stroke-width: 2; }
      .roof { fill: #2a2224; stroke: #4a3d40; stroke-width: 2; }
      .floor { stroke: #3a4652; stroke-width: 1.5; }
      .win { fill: #141a21; stroke: #3a4652; stroke-width: 1.5; }
      .t { fill: #e6edf3; font-size: 26px; }
      .ts { fill: #8b98a5; font-size: 22px; }
      .tl { fill: #e6edf3; font-size: 34px; font-weight: 600; }
      .tk { fill: #8b98a5; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
      .pv { fill: #f5c542; } .grid { fill: #a78bfa; } .bat { fill: #3ecf8e; } .heat { fill: #ff7a45; }
      .dot { fill: #3a4652; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 10; animation: run 1s linear infinite; }
      .flow.pv { stroke: #f5c542; } .flow.grid { stroke: #a78bfa; } .flow.bat { stroke: #3ecf8e; }
      .flow.load { stroke: #c0c8d0; } .flow.heat { stroke: #ff7a45; } .flow.cool { stroke: #4ea1ff; }
      .cable { fill: none; stroke: #8b98a5; stroke-width: 3; stroke-linecap: round; }
      @keyframes run { to { stroke-dashoffset: -12; } }
    </style>
    <linearGradient id="ww" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a45" /><stop offset=".55" stop-color="#ff7a45" stop-opacity=".55" /><stop offset="1" stop-color="#4ea1ff" stop-opacity=".5" />
    </linearGradient>
    <linearGradient id="puf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a45" stop-opacity=".8" /><stop offset="1" stop-color="#ff7a45" stop-opacity=".25" />
    </linearGradient>
    <pattern id="pvcell" width="22" height="16" patternUnits="userSpaceOnUse">
      <rect width="21" height="15" fill="#1c2c42" stroke="#f5c542" stroke-opacity=".35" />
    </pattern>
    <pattern id="boards" width="12" height="20" patternUnits="userSpaceOnUse">
      <rect width="12" height="20" fill="#232b33" /><line x1="0.5" y1="0" x2="0.5" y2="20" stroke="#3a4652" />
    </pattern>
    <symbol id="warnicon" viewBox="0 0 20 20"><path d="M10 1 19 18H1Z" fill="#ffb020" /><rect x="9" y="7" width="2" height="6" fill="#0f1318" /><rect x="9" y="14.5" width="2" height="2" fill="#0f1318" /></symbol>
    <symbol id="car" viewBox="0 0 140 64">
      <path d="M8 50 Q12 24 38 20 L92 18 Q112 18 124 34 L134 50 Z" fill="#2a3542" stroke="#8b98a5" />
      <circle cx="36" cy="52" r="10" fill="#0f1318" stroke="#8b98a5" /><circle cx="106" cy="52" r="10" fill="#0f1318" stroke="#8b98a5" />
    </symbol>
  </defs>

  <rect class="bg" width="720" height="1820" />

  
